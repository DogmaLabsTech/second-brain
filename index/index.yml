# qmd config for second-brain. brain onboard writes ~/.config/qmd/index.yml from this file plus one
# "notes-<name>" collection for every notes folder you choose; index/setup.sh installs it by hand.
# qmd always skips node_modules, .git, .cache, vendor, dist, build on its own.
global_context: "A personal second brain: one folder, ~/brain, with sections for rules, agent memory, project notes, private notes, chat histories, day pages and an inbox, plus any notes folders you added."
# includeByDefault: false on every collection is on purpose. When a search names no collection,
# qmd then searches all notes as one list. With the default (true) it ran one list per collection
# and took turns between them, so the 2nd and 3rd results were the best of *other* collections.
# Keep this list in step with ask/ask.py COLLECTIONS. Each section's README.md and CONTEXT.md say how the
# section works; they are not notes.
collections:
  brain:
    includeByDefault: false
    path: ~/brain
    # Only the files at the top: the brain's own README (the map of the sections).
    pattern: "*.md"
    ignore:
      - "CONTEXT.md"
    context:
      "/": "The top of the brain: README.md says which section holds what."
  rules:
    includeByDefault: false
    path: ~/brain/rules
    pattern: "**/*.md"
    ignore:
      - "README.md"
      - "CONTEXT.md"
    context:
      "/": "Standing rules for every agent: how you want work done."
  memory:
    includeByDefault: false
    path: ~/brain/agents
    # Rules and lessons for agents, one note per file, under projects/<repo>/rules|lessons and all-projects/.
    pattern: "**/*.md"
    ignore:
      # Drafts wait for your keep or drop and are never pushed to agents.
      - "drafts/**"
      - "README.md"
      - "CONTEXT.md"
    context:
      "/": "Agent memory: rules and lessons learned, by project."
  project-notes:
    includeByDefault: false
    path: ~/brain/projects
    pattern: "**/*.md"
    ignore:
      - "README.md"
      - "CONTEXT.md"
    context:
      "/": "Notes about your projects: plans, decisions and history, one folder per project."
  private:
    includeByDefault: false
    path: ~/brain/private
    # Never leaves this computer: no online model ever sees these notes.
    pattern: "**/*.md"
    ignore:
      - "README.md"
      - "CONTEXT.md"
    context:
      "/": "Private notes. They stay on this computer."
  chats:
    includeByDefault: false
    path: ~/brain/chats
    # Your Claude Code chats as notes (chats/convert.py). Low-value chats go to low/ and are not indexed.
    pattern: "**/*.md"
    ignore:
      - "codex/**"
      - "low/**"
      - "README.md"
    context:
      "/": "Past Claude Code chats, one note per chat, with secrets removed."
  codex:
    includeByDefault: false
    path: ~/brain/chats/codex
    pattern: "**/*.md"
    ignore:
      - "README.md"
    context:
      "/": "Past Codex chats, one note per chat, with secrets removed."
  days:
    includeByDefault: false
    path: ~/brain/days
    pattern: "**/*.md"
    context:
      "/": "Day pages: what moved each day, standups and weekly pages."
  inbox:
    includeByDefault: false
    path: ~/brain/inbox
    pattern: "**/*.md"
    ignore:
      - "README.md"
    context:
      "/": "Things waiting to be sorted."
  media:
    includeByDefault: false
    path: ~/Media/agents
    pattern: "**/*.md"
    context:
      "/": "Notes about pictures, videos and other media your agents made."
