</defs><style>@keyframes sweep{0%{transform:translateX(0);opacity:0}8%{opacity:1}55%{transform:translateX(470px);opacity:1}62%{opacity:0}100%{transform:translateX(470px);opacity:0}}@keyframes after{0%{opacity:0}50%{opacity:0}62%{opacity:1}92%{opacity:1}100%{opacity:0}}@keyframes hot{0%,45%{fill:#ffa62b}58%,100%{fill:#6f8aa3}}</style><polygon points="46,30 390,30 390,254 374,270 30,270 30,46" fill="#08111f" stroke="#3be6ff" stroke-width="1.3"/><text x="52" y="62" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="3" fill="#3be6ff">YOUR CHAT</text><polygon points="626,30 970,30 970,254 954,270 610,270 610,46" fill="#08111f" stroke="#5dffb0" stroke-width="1.3"/><text x="632" y="62" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="3" fill="#5dffb0">A NOTE IN YOUR BRAIN</text><text x="52" y="96" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#ffa62b" font-weight="700">You</text><text x="52" y="121" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#d4ecff">we are debugging the checkout flow.</text><text x="52" y="146" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" style="animation:hot 9s linear infinite" fill="#ffa62b">My API key is sk-ant-api03-EXAMPLE…</text><text x="52" y="171" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#d4ecff">please do not echo it.</text><text x="52" y="196" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#3be6ff" font-weight="700">Claude</text><text x="52" y="221" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#d4ecff">The coupon field reads the cart total</text><text x="52" y="246" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#d4ecff">before the subscription line is added.</text><g style="animation:after 9s linear infinite;opacity:0"><text x="632" y="96" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#ffa62b" font-weight="700">You</text><text x="632" y="121" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#d4ecff">we are debugging the checkout flow.</text><text x="632" y="146" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#5dffb0" filter="url(#glow)">My API key is [redacted]</text><text x="632" y="171" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#d4ecff">please do not echo it.</text><text x="632" y="196" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#3be6ff" font-weight="700">Claude</text><text x="632" y="221" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#d4ecff">The coupon field reads the cart total</text><text x="632" y="246" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#d4ecff">before the subscription line is added.</text></g><g style="animation:sweep 9s linear infinite;opacity:0"><rect x="395" y="34" width="3" height="232" fill="url(#beam)" filter="url(#glow)"/><polygon points="386,150 402,150 394,162" fill="#3be6ff"/><polygon points="386,138 402,138 394,126" fill="#3be6ff"/></g><text x="500" y="298" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="4" fill="#ffa62b">REDACTION PASS  //  BEFORE ANYTHING IS SAVED</text><path d="M404 150h12m-6-6 6 6-6 6M584 150h12m-6-6 6 6-6 6" stroke="#3be6ff" fill="none" stroke-width="2"/><rect width="1000" height="312" fill="url(#scan)"/></svg>
